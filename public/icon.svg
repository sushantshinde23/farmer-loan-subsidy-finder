<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#portalGrad)"/>
  <!-- Inner Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Wheat & Sprout emblem -->
  <g transform="translate(256, 270) scale(1.6)">
    <!-- Central stalk -->
    <path d="M0,80 Q0,0 0,-90" stroke="#fef08a" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Leaves / grains left -->
    <path d="M-3,-50 Q-28,-70 -35,-45 Q-20,-30 -3,-35" fill="url(#goldGrad)"/>
    <path d="M-3,-25 Q-35,-40 -40,-15 Q-20,-5 -3,-10" fill="url(#goldGrad)"/>
    <path d="M-3,0 Q-38,-10 -38,15 Q-18,20 -3,15" fill="url(#goldGrad)"/>
    <path d="M-3,25 Q-32,25 -25,48 Q-10,40 -3,35" fill="url(#goldGrad)"/>
    
    <!-- Leaves / grains right -->
    <path d="M3,-50 Q28,-70 35,-45 Q20,-30 3,-35" fill="url(#goldGrad)"/>
    <path d="M3,-25 Q35,-40 40,-15 Q20,-5 3,-10" fill="url(#goldGrad)"/>
    <path d="M3,0 Q38,-10 38,15 Q18,20 3,15" fill="url(#goldGrad)"/>
    <path d="M3,25 Q32,25 25,48 Q10,40 3,35" fill="url(#goldGrad)"/>
    
    <!-- Top grain head -->
    <path d="M0,-95 Q-12,-115 0,-125 Q12,-115 0,-95" fill="#fde047"/>
    
    <!-- Base green shoots -->
    <path d="M-2,60 Q-40,65 -50,45 Q-30,40 -2,52" fill="#4ade80"/>
    <path d="M2,60 Q40,65 50,45 Q30,40 2,52" fill="#4ade80"/>
  </g>
  
  <!-- Rupee Symbol badge at bottom -->
  <circle cx="256" cy="400" r="44" fill="#064e3b" stroke="#f59e0b" stroke-width="4"/>
  <text x="256" y="415" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="42" font-weight="bold" fill="#fef08a" text-anchor="middle">₹</text>
</svg>
